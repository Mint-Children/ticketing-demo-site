services:
  app:
    build:
      context: .
      args:
        VLUR_API_BASE: ${VITE_VLUR_API_BASE:-http://localhost:8000}
        VLUR_PUBLIC_SITE_KEY: ${VITE_VLUR_SITE_KEY:-pk-aicap_dev_testuser_001}
    ports:
      - "${APP_PORT:-5298}:80"
    restart: unless-stopped

  dev:
    image: node:22-alpine
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_VLUR_API_BASE: ${VITE_VLUR_API_BASE:-http://localhost:8000}
      VITE_VLUR_SITE_KEY: ${VITE_VLUR_SITE_KEY:-pk-aicap_dev_testuser_001}
    ports:
      - "${DEV_PORT:-5298}:5298"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules: